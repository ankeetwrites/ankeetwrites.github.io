<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="80%" cy="40%" r="60%">
      <stop offset="0" stop-color="#1ABC9C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#1ABC9C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3E4250" stroke-width="1" opacity=".45"/>
    </pattern>
  <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1ABC9C" stop-opacity=".25"/>
      <stop offset=".6" stop-color="#1ABC9C" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="800" fill="#232427"/>
  <rect width="1600" height="800" fill="url(#grid)"/>
  <rect width="1600" height="800" fill="url(#glow)"/>

  <!-- Background noise: individual case reports -->
  <g fill="#707890" opacity=".4">
    <circle cx="140" cy="560" r="5"/><circle cx="210" cy="610" r="4"/><circle cx="260" cy="520" r="6"/>
    <circle cx="330" cy="590" r="4"/><circle cx="380" cy="640" r="5"/><circle cx="420" cy="540" r="4"/>
    <circle cx="470" cy="600" r="6"/><circle cx="520" cy="660" r="4"/><circle cx="560" cy="570" r="5"/>
    <circle cx="610" cy="620" r="4"/><circle cx="660" cy="550" r="5"/><circle cx="700" cy="640" r="4"/>
    <circle cx="180" cy="660" r="4"/><circle cx="300" cy="680" r="5"/><circle cx="450" cy="690" r="4"/>
    <circle cx="760" cy="600" r="5"/><circle cx="820" cy="660" r="4"/><circle cx="1260" cy="610" r="5"/>
    <circle cx="1320" cy="660" r="4"/><circle cx="1380" cy="590" r="5"/><circle cx="1440" cy="650" r="4"/>
    <circle cx="1500" cy="600" r="5"/><circle cx="1200" cy="680" r="4"/>
  </g>

  <!-- Baseline expectation -->
  <path d="M60 560 C 400 540, 700 560, 900 545 S 1300 560, 1540 550" fill="none" stroke="#707890" stroke-width="2" stroke-dasharray="8 10" opacity=".7"/>

  <!-- The signal: reports rising above the baseline -->
  <path d="M60 600 L 400 590 L 700 600 L 900 585 L 1060 540 L 1160 430 L 1250 260 L 1320 310 L 1390 440 L 1470 510 L 1560 525"
        fill="none" stroke="url(#fade)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Signal cluster -->
  <g fill="#1ABC9C">
    <circle cx="1190" cy="380" r="7"/><circle cx="1220" cy="310" r="8"/><circle cx="1250" cy="260" r="10"/>
    <circle cx="1280" cy="285" r="7"/><circle cx="1310" cy="330" r="6"/><circle cx="1235" cy="340" r="5"/>
  </g>
  <circle cx="1250" cy="260" r="44" fill="none" stroke="#1ABC9C" stroke-width="2" opacity=".6"/>
  <circle cx="1250" cy="260" r="78" fill="none" stroke="#1ABC9C" stroke-width="1.5" opacity=".3"/>

  <!-- Capsule -->
  <g transform="translate(1330 640) rotate(-30) scale(.8)">
    <rect x="0" y="0" width="260" height="104" rx="52" fill="#2C2F36" stroke="#C9D3E7" stroke-width="4"/>
    <path d="M52 0 H130 V104 H52 A52 52 0 0 1 52 0 Z" fill="#1ABC9C"/>
    <rect x="0" y="0" width="260" height="104" rx="52" fill="none" stroke="#C9D3E7" stroke-width="4"/>
    <path d="M40 28 A34 34 0 0 0 30 52" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".5"/>
  </g>
</svg>
